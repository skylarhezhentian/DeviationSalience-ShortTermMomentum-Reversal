name: Tests and synthetic demonstration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install the tested dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Check timing, membership, inference, and synthetic fixtures
        run: python -m unittest discover -s tests -v
      - name: Run the included synthetic sample
        run: python scripts/run_demo.py
      - name: Retain synthetic verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-verification
          if-no-files-found: ignore
          path: |
            outputs/demo/SYNTHETIC_DATA.json
            outputs/demo/validation.json
            outputs/demo/RESULTS.md
            outputs/demo/figures/*.png
            outputs/demo/figures/*.svg
